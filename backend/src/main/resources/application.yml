server:
  port: 8080

spring:
  application:
    name: pnl-tracker-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:sqlite:./pnl-tracker.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

portfolio:
  provider: alchemy
  cache-ttl-seconds: 180
  async:
    alchemy-concurrency: ${ALCHEMY_CONCURRENCY:3}
    alchemy-queue-capacity: ${ALCHEMY_QUEUE_CAPACITY:32}
  alchemy:
    base-url: https://api.g.alchemy.com
    api-key: ${ALCHEMY_API_KEY:docs-demo}
  goldrush:
    enabled: ${PORTFOLIO_GOLDRUSH_ENABLED:true}
    base-url: https://api.covalenthq.com
    api-key: ${PORTFOLIO_GOLDRUSH_API_KEY:${GOLDRUSH_API_KEY:}}
    timeout-seconds: ${PORTFOLIO_GOLDRUSH_TIMEOUT_SECONDS:20}
    solana-balances-enabled: ${PORTFOLIO_GOLDRUSH_SOLANA_BALANCES_ENABLED:true}
    solana-chain-name: ${PORTFOLIO_GOLDRUSH_SOLANA_CHAIN_NAME:solana-mainnet}

solana:
  defi:
    worker:
      base-url: ${SOLANA_DEFI_WORKER_URLS:${SOLANA_DEFI_WORKER_URL:http://localhost:8787}}
      timeout-seconds: ${SOLANA_DEFI_WORKER_TIMEOUT_SECONDS:90}

zerion:
  api:
    base-url: https://api.zerion.io/v1
    api-key: ${ZERION_API_KEY:}

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    max-tokens: 2000

yield:
  market:
    defillama:
      base-url: ${YIELD_DEFILLAMA_BASE_URL:https://yields.llama.fi}
      min-tvl-usd: ${YIELD_MIN_TVL_USD:50000000}
      max-apy: ${YIELD_MAX_APY:15}
      cache-ttl-seconds: ${YIELD_CACHE_TTL_SECONDS:900}
      max-options: ${YIELD_MAX_OPTIONS:8}
